name: Release Docker Image

on:
  release:
    types:
      - published

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IMAGE_NAME: ghcr.io/usehiveloop/employee-sandbox

jobs:
  publish:
    name: Publish employee sandbox image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          cache-targets: true

      - name: Build production binary
        run: cargo build --release --locked -p employee-bridge

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          semver="${tag#v}"
          if [[ ! "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic versioned, got: ${tag}" >&2
            exit 1
          fi

          tags="${IMAGE_NAME}:${tag}"
          if [[ "$semver" != "$tag" ]]; then
            tags="${tags},${IMAGE_NAME}:${semver}"
          fi
          if [[ "${{ github.event.release.prerelease }}" != "true" ]]; then
            tags="${tags},${IMAGE_NAME}:latest"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker build context
        run: cp target/release/employee-bridge ./employee-bridge

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
